name: Publish devlog updates

on:
  push:
    branches: [main]
    paths:
      - 'devlog.md'
      - 'entries/**'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: devlog-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история — нужна для дельты)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Publish delta to updates branch
        run: python3 scripts/publish_updates.py
